name: PR title check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate that the PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|bench|chore|refactor|test|ci|perf|style)(\(.+\))?: .+'; then
            echo "::error::PR title must start with feat, fix, docs, bench, chore, refactor, test, ci, perf or style."
            exit 1
          fi
