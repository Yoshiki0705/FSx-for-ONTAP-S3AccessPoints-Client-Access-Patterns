# gitleaks configuration: default rules plus two rules for identifiers this repository must not publish.
title = "gitleaks config for the client access patterns repository"

[extend]
useDefault = true

[allowlist]
paths = ['''__pycache__/''']

[[rules]]
id = "private-ip-address"
description = "Private IPv4 address outside the documented placeholder ranges"
regex = '''(?:^|[^0-9.])(10\.(?:[1-9]\d{0,2}|0\.\d{1,3}\.\d{1,3}\.\d{1,3}\b)|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})(?:[^0-9]|$)'''
tags = ["internal", "network"]

[rules.allowlist]
# The gate tests contain deliberately bad sample addresses (marked allow:safety).
paths = ['''scripts/tests/''']

[[rules]]
id = "aws-arn-account-id"
description = "ARN that carries an AWS account ID other than a placeholder shape"
regex = '''arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:(\d{12}):'''
tags = ["aws", "account-id"]

[rules.allowlist]
regexTarget = "match"
regexes = [
  '''(?:000000000000|111111111111|222222222222|333333333333|444444444444|555555555555|666666666666|777777777777|888888888888|999999999999|123456789012|987654321098|111122223333)''',
]
